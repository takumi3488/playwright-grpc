name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
      - name: Run tests
        uses: takumi3488/mygha/bun/test@70f9d7823811682734c91d199d0e5e4b8d7822ea # main

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Install grpc-health-probe
        run: go install github.com/grpc-ecosystem/grpc-health-probe@latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Up Docker Compose services
        run: docker compose up -d --wait playwright-grpc

      - name: Show container logs
        if: always()
        run: docker compose logs playwright-grpc

      - name: Wait for gRPC server to be healthy
        run: |
          echo "Waiting for gRPC server to be healthy..."
          timeout 60s bash -c 'until $(go env GOPATH)/bin/grpc-health-probe -addr=localhost:50051; do echo "Waiting..."; sleep 2; done'
          echo "gRPC server is healthy!"

      - name: Install runn
        run: go install github.com/k1LoW/runn/cmd/runn@latest

      - name: Run E2E tests
        run: $(go env GOPATH)/bin/runn run ./e2e.runbook.yml

