name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        
      - name: Run tests
        uses: takumi3488/mygha/bun/test@12095312d7585ec94e3fbb4f1826a0bdbb404ee5 # main

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install grpc-health-probe
        run: go install github.com/grpc-ecosystem/grpc-health-probe@latest

      - name: Up Docker Compose services
        run: docker compose up -d --wait playwright-grpc

      - name: Show container logs
        if: always()
        run: docker compose logs playwright-grpc

      - name: Wait for gRPC server to be healthy
        run: |
          echo "Waiting for gRPC server to be healthy..."
          timeout 60s bash -c 'until $(go env GOPATH)/bin/grpc-health-probe -addr=localhost:50051; do echo "Waiting..."; sleep 2; done'
          echo "gRPC server is healthy!"

      - name: Install runn
        run: go install github.com/k1LoW/runn/cmd/runn@latest

      - name: Run E2E tests
        run: $(go env GOPATH)/bin/runn run ./e2e.runbook.yml

  automerge:
    runs-on: ubuntu-latest
    needs: [test, e2e-test]
    if: github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: automerge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge"
